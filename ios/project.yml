# The Lockin iPhone app, as an XcodeGen spec: `brew install xcodegen`, then
# `xcodegen` in this folder makes LockinPhone.xcodeproj (not kept in git).
# To put it on your own iPhone with a free Apple ID, see ios/README.md.
name: LockinPhone
options:
  bundleIdPrefix: com.sandeswelagedara
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  LockinKit:
    path: LockinKit
targets:
  LockinPhone:
    type: application
    platform: iOS
    sources:
      - path: LockinPhone
    dependencies:
      - package: LockinKit
    info:
      path: LockinPhone/Info.plist
      properties:
        CFBundleDisplayName: Lockin
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        # Syncing talks to the computer on the local network, over its own encryption.
        NSLocalNetworkUsageDescription: Lockin syncs your lectures with Lockin on your computer over your Wi-Fi.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: Scan the pairing code shown in Lockin's Settings on your computer.
        # lockin://pair?… opens the app from the Camera app's QR scanner.
        CFBundleURLTypes:
          - CFBundleURLName: com.sandeswelagedara.lockin.pair
            CFBundleURLSchemes: [lockin]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sandeswelagedara.lockin
        PRODUCT_NAME: Lockin
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        # Your Apple ID's team: set it in Xcode → Signing & Capabilities.
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
