name: Lockin
options:
  bundleIdPrefix: app
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  LockinCore:
    path: .
targets:
  Lockin:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Lockin
    resources:
      - path: ../../prompts
        buildPhase:
          copyFiles:
            destination: resources
            subpath: prompts
      - path: ../../prisma/migrations
        buildPhase:
          copyFiles:
            destination: resources
            subpath: migrations
      - path: ../../build/icon.icns
    dependencies:
      - package: LockinCore
        product: LockinCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lockin
        PRODUCT_NAME: Lockin
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_CFBundleIconFile: icon.icns
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSHumanReadableCopyright: "Sandes Welagedara"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
