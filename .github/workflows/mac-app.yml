# Builds Lockin.dmg on a Mac (a .dmg can only be made on macOS) and publishes it as the
# "Lockin for Mac" release, so the latest build is always one download away — and, with
# lockin-update.tar.gz and update.json beside it, one click away in Settings → Updates:
# https://github.com/surfxce/letslockin/releases/download/mac-latest/Lockin.dmg
name: Mac app

on:
  push:
    branches: [main, claude/blissful-carson-5hdqo3]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-latest # Apple Silicon
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # MLX needs a current Xcode, and xcodebuild (not plain SwiftPM) to compile its
      # Metal shaders. If the engine fails to build, the app still ships without it and
      # runs offline models on llama.cpp.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build the MLX engine
        id: engine
        continue-on-error: true
        working-directory: swift/LockinEngine
        run: |
          xcodebuild -list
          xcodebuild build -scheme lockin-engine -destination 'platform=macOS,arch=arm64' \
            -configuration Release -derivedDataPath .build-xcode \
            -skipMacroValidation -skipPackagePluginValidation
          mkdir -p ../../engine
          cp -R .build-xcode/Build/Products/Release/lockin-engine ../../engine/
          cp -R .build-xcode/Build/Products/Release/*.bundle ../../engine/ 2>/dev/null || true
          ls -la ../../engine
      - name: Build Lockin.dmg
        run: npm run dmg -- --publish never
        env:
          DATABASE_URL: file:./prisma/build.db
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Pack the in-app update
        run: node scripts/pack-update.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Lockin-mac
          path: |
            release/Lockin.dmg
            release/lockin-update.tar.gz
            release/update.json
          if-no-files-found: error
      - name: Publish as the latest Mac build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mac-latest --yes --cleanup-tag || true
          gh release create mac-latest release/Lockin.dmg release/lockin-update.tar.gz release/update.json \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Lockin for Mac (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Open Lockin.dmg and drag Lockin into Applications. It isn't signed by Apple, so the first time, right-click Lockin in Applications and choose Open."
